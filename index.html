<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG Smart IPTV</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        body.light-theme {
            background: #f0f0f0;
            color: #1a1a1a;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.2s;
            min-height: 48px;
            min-width: 48px;
        }
        button:hover,
        button:focus {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }
        button:active {
            transform: scale(0.98);
        }
        input,
        select {
            font-family: inherit;
            font-size: 1rem;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: inherit;
            width: 100%;
            transition: border 0.2s;
            min-height: 48px;
        }
        input:focus,
        select:focus {
            border-color: #4a9eff;
            outline: none;
        }
        body.light-theme input,
        body.light-theme select {
            background: #ffffff;
            border-color: #cccccc;
            color: #1a1a1a;
        }
        body.light-theme button {
            background: #e0e0e0;
            color: #1a1a1a;
        }
        body.light-theme button:hover,
        body.light-theme button:focus {
            background: #d0d0d0;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a9eff;
            border-radius: 4px;
        }

        /* ===== CONTAINERS ===== */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ===== PANEL (LOGIN) ===== */
        #panel-screen {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .panel-left {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            min-width: 400px;
        }
        .panel-right {
            flex: 1.2;
            padding: 40px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.1);
        }
        body.light-theme .panel-left {
            background: rgba(255, 255, 255, 0.5);
        }
        body.light-theme .panel-right {
            background: rgba(255, 255, 255, 0.3);
        }

        .panel-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .panel-subtitle {
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .form-actions button {
            flex: 1;
            min-width: 100px;
        }
        .btn-primary {
            background: #4a9eff !important;
            color: #fff !important;
        }
        .btn-primary:hover,
        .btn-primary:focus {
            background: #3a8eef !important;
        }
        .btn-danger {
            background: #ff4a4a !important;
            color: #fff !important;
        }
        .btn-danger:hover,
        .btn-danger:focus {
            background: #e63a3a !important;
        }
        .btn-success {
            background: #4acf6a !important;
            color: #fff !important;
        }
        .btn-success:hover,
        .btn-success:focus {
            background: #3abf5a !important;
        }

        /* ===== ACCOUNT LIST ===== */
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border-left: 4px solid #4a9eff;
            transition: all 0.2s;
            cursor: pointer;
        }
        .account-item:hover,
        .account-item:focus {
            background: rgba(255, 255, 255, 0.1);
        }
        body.light-theme .account-item {
            background: #ffffff;
            border-left-color: #4a9eff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        body.light-theme .account-item:hover {
            background: #f5f5f5;
        }
        .account-item .info {
            flex: 1;
        }
        .account-item .info .name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .account-item .info .url {
            font-size: 0.85rem;
            opacity: 0.6;
        }
        .account-item .actions {
            display: flex;
            gap: 8px;
        }
        .account-item .actions button {
            padding: 6px 12px;
            font-size: 0.85rem;
            min-height: 36px;
            min-width: 36px;
        }

        /* ===== PLAYER SCREEN ===== */
        #player-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        #player-screen.active {
            display: flex;
        }

        /* ===== VIDEO CONTAINER ===== */
        .video-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* ===== PLAYER CONTROLS ===== */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 30px 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .video-wrapper:hover .player-controls,
        .video-wrapper:focus-within .player-controls,
        .player-controls.active {
            opacity: 1;
            pointer-events: auto;
        }
        .controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls-top .title {
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        .controls-top .actions {
            display: flex;
            gap: 12px;
        }
        .controls-top .actions button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            min-height: 40px;
            min-width: 40px;
            border-radius: 6px;
        }
        .controls-top .actions button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .controls-bottom {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .controls-bottom button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            min-height: 40px;
            min-width: 40px;
            border-radius: 6px;
        }
        .controls-bottom button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }
        .progress-bar .fill {
            height: 100%;
            background: #4a9eff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }
        .progress-bar .handle {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 14px;
            height: 14px;
            background: #4a9eff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #fff;
        }
        .time-display {
            font-size: 0.85rem;
            font-weight: 500;
            min-width: 100px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
        }
        .volume-control input[type="range"] {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            padding: 0;
        }
        .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #4a9eff;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        /* ===== SIDEBAR (CATEGORIES) ===== */
        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            padding: 20px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s;
            z-index: 10;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .sidebar-header h2 {
            font-size: 1.4rem;
        }
        .sidebar-header button {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            min-height: 36px;
            min-width: 36px;
        }
        .sidebar-search {
            margin-bottom: 16px;
        }
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .category-item {
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-item:hover,
        .category-item:focus {
            background: rgba(255, 255, 255, 0.1);
        }
        .category-item.active {
            background: #4a9eff;
            color: #fff;
        }
        .category-item .count {
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .category-item.active .count {
            opacity: 0.8;
        }

        /* ===== CHANNEL GRID ===== */
        .channel-grid {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 20px 20px 100px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            align-content: start;
            background: rgba(0, 0, 0, 0.3);
        }
        .channel-grid.hidden {
            display: none;
        }
        .channel-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            text-align: center;
        }
        .channel-card:hover,
        .channel-card:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #4a9eff;
            transform: scale(1.02);
        }
        .channel-card .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .channel-card .icon img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 8px;
        }
        .channel-card .name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .channel-card .meta {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 4px;
        }
        .channel-card .favorite-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: none;
            color: #ffd700;
        }
        .channel-card .favorite-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }
        .channel-card {
            position: relative;
        }

        /* ===== LOADING / ERROR ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
        }
        .loading-overlay.hidden {
            display: none;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-overlay p {
            margin-top: 16px;
            font-size: 1.1rem;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1rem;
            z-index: 100;
            border-left: 4px solid #4a9eff;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 80%;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            border-left-color: #ff4a4a;
        }
        .toast.success {
            border-left-color: #4acf6a;
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: none;
            color: inherit;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .panel-left {
                min-width: 300px;
                padding: 30px;
            }
            .panel-right {
                padding: 30px;
            }
            .sidebar {
                width: 280px;
            }
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                padding: 16px 16px 100px;
            }
        }
        @media (max-width: 768px) {
            #panel-screen {
                flex-direction: column;
            }
            .panel-left {
                min-width: unset;
                padding: 20px;
            }
            .panel-right {
                padding: 20px;
                max-height: 50vh;
            }
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                padding: 12px 12px 100px;
            }
            .sidebar {
                width: 100%;
            }
            .controls-bottom {
                flex-wrap: wrap;
            }
            .volume-control {
                min-width: 60px;
            }
            .volume-control input[type="range"] {
                width: 50px;
            }
        }

        /* ===== FOCUS MANAGEMENT ===== */
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        .account-item:focus-visible,
        .category-item:focus-visible,
        .channel-card:focus-visible {
            outline: 3px solid #4a9eff;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== THEME TOGGLE ===== -->
    <button id="themeToggle" class="theme-toggle" aria-label="Tema değiştir">☀️</button>

    <!-- ===== APP CONTAINER ===== -->
    <div class="app-container">

        <!-- ===== PANEL SCREEN ===== -->
        <div id="panel-screen">
            <div class="panel-left">
                <h1 class="panel-title">📺 IPTV</h1>
                <p class="panel-subtitle">Hesabınızı ekleyin veya mevcut hesabı seçin</p>

                <div class="form-group">
                    <label for="serverUrl">Sunucu URL</label>
                    <input type="text" id="serverUrl" placeholder="http://example.com:8080" />
                </div>
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" placeholder="kullanici_adi" />
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" placeholder="••••••••" />
                </div>

                <div class="form-actions">
                    <button id="saveAccountBtn" class="btn-primary">💾 Kaydet</button>
                    <button id="clearFormBtn">🗑️ Temizle</button>
                </div>
                <div style="margin-top:12px;font-size:0.85rem;opacity:0.6;">
                    <span id="licenseStatus">🔒 Lisans: Kontrol ediliyor...</span>
                </div>
            </div>

            <div class="panel-right">
                <h2 style="font-size:1.4rem;margin-bottom:16px;">📋 Kayıtlı Hesaplar</h2>
                <div id="accountList" class="account-list">
                    <!-- dynamically rendered -->
                </div>
            </div>
        </div>

        <!-- ===== PLAYER SCREEN ===== -->
        <div id="player-screen">
            <div class="video-wrapper" id="videoWrapper">
                <video id="videoPlayer" playsinline></video>

                <!-- ===== SIDEBAR ===== -->
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <h2>📂 Kategoriler</h2>
                        <button id="closeSidebarBtn">✕</button>
                    </div>
                    <div class="sidebar-search">
                        <input type="text" id="searchInput" placeholder="🔍 Kanal, film, dizi ara..." />
                    </div>
                    <div class="category-list" id="categoryList">
                        <!-- dynamically rendered -->
                    </div>
                </div>

                <!-- ===== CHANNEL GRID ===== -->
                <div class="channel-grid" id="channelGrid">
                    <!-- dynamically rendered -->
                </div>

                <!-- ===== LOADING ===== -->
                <div class="loading-overlay hidden" id="loadingOverlay">
                    <div class="spinner"></div>
                    <p id="loadingText">Yükleniyor...</p>
                </div>

                <!-- ===== PLAYER CONTROLS ===== -->
                <div class="player-controls" id="playerControls">
                    <div class="controls-top">
                        <span class="title" id="currentTitle">İsim</span>
                        <div class="actions">
                            <button id="favoriteBtn" aria-label="Favori">⭐</button>
                            <button id="sidebarToggleBtn" aria-label="Kategoriler">📂</button>
                            <button id="backToPanelBtn" aria-label="Panele dön">🏠</button>
                        </div>
                    </div>
                    <div class="controls-bottom">
                        <button id="playPauseBtn">⏸️</button>
                        <div class="progress-container">
                            <span class="time-display" id="currentTime">0:00</span>
                            <div class="progress-bar" id="progressBar">
                                <div class="fill" id="progressFill"></div>
                                <div class="handle" id="progressHandle"></div>
                            </div>
                            <span class="time-display" id="durationTime">0:00</span>
                        </div>
                        <div class="volume-control">
                            <button id="muteBtn">🔊</button>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                        </div>
                        <button id="fullscreenBtn">⛶</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== HLS.JS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js">
    </script>

    <script>
        /* ==============================================================
               LG Smart IPTV - Optimized for LG webOS
               ============================================================== */

        (function() {
            'use strict';

            // =============================================================
            // 1. STATE
            // =============================================================
            var STATE = {
                accounts: [],
                currentAccountId: null,
                currentCategory: null,
                currentItem: null,
                currentType: 'live',
                favorites: [],
                watchHistory: {},
                isPlaying: false,
                isLoading: false,
                hlsInstance: null,
                isLightTheme: false,
                licenseValid: false,
                licenseExpiry: null,
                deviceId: null,
                apiCache: {},
                currentStreamUrl: null,
                sidebarOpen: false,
                searchQuery: '',
                isInitialized: false,
                allItems: [], // Store all items for filtering
                currentPage: 0,
                pageSize: 50, // Load 50 items at a time
                isLoadingMore: false,
                allItemsLoaded: false
            };

            // =============================================================
            // 2. DOM REFS
            // =============================================================
            var $ = function(id) { return document.getElementById(id); };

            var dom = {
                panelScreen: $('panel-screen'),
                playerScreen: $('player-screen'),
                serverUrl: $('serverUrl'),
                username: $('username'),
                password: $('password'),
                accountList: $('accountList'),
                saveAccountBtn: $('saveAccountBtn'),
                clearFormBtn: $('clearFormBtn'),
                themeToggle: $('themeToggle'),
                licenseStatus: $('licenseStatus'),

                videoPlayer: $('videoPlayer'),
                videoWrapper: $('videoWrapper'),
                playerControls: $('playerControls'),
                currentTitle: $('currentTitle'),
                playPauseBtn: $('playPauseBtn'),
                progressBar: $('progressBar'),
                progressFill: $('progressFill'),
                progressHandle: $('progressHandle'),
                currentTime: $('currentTime'),
                durationTime: $('durationTime'),
                volumeSlider: $('volumeSlider'),
                muteBtn: $('muteBtn'),
                fullscreenBtn: $('fullscreenBtn'),
                favoriteBtn: $('favoriteBtn'),
                sidebarToggleBtn: $('sidebarToggleBtn'),
                backToPanelBtn: $('backToPanelBtn'),

                sidebar: $('sidebar'),
                closeSidebarBtn: $('closeSidebarBtn'),
                categoryList: $('categoryList'),
                channelGrid: $('channelGrid'),
                searchInput: $('searchInput'),

                loadingOverlay: $('loadingOverlay'),
                loadingText: $('loadingText'),
                toast: $('toast')
            };

            // =============================================================
            // 3. UTILITY FUNCTIONS
            // =============================================================

            function generateId() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
            }

            function getDeviceId() {
                try {
                    var id = localStorage.getItem('iptv_device_id');
                    if (!id) {
                        id = 'DEV_' + generateId();
                        localStorage.setItem('iptv_device_id', id);
                    }
                    return id;
                } catch (e) {
                    return 'DEV_' + generateId();
                }
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
                var h = Math.floor(seconds / 3600);
                var m = Math.floor((seconds % 3600) / 60);
                var s = Math.floor(seconds % 60);
                if (h > 0) {
                    return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                }
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            function showToast(message, type) {
                if (!dom.toast) return;
                type = type || 'info';
                dom.toast.textContent = message;
                dom.toast.className = 'toast ' + type + ' show';
                clearTimeout(dom.toast._hideTimer);
                dom.toast._hideTimer = setTimeout(function() {
                    dom.toast.className = 'toast';
                }, 4000);
            }

            function showLoading(text) {
                if (!dom.loadingOverlay) return;
                text = text || 'Yükleniyor...';
                dom.loadingText.textContent = text;
                dom.loadingOverlay.className = 'loading-overlay';
            }

            function hideLoading() {
                if (!dom.loadingOverlay) return;
                dom.loadingOverlay.className = 'loading-overlay hidden';
            }

            function safeParseJSON(str) {
                try {
                    return JSON.parse(str);
                } catch (e) {
                    return null;
                }
            }

            function debounce(fn, delay) {
                var timer = null;
                return function() {
                    var args = arguments;
                    var context = this;
                    clearTimeout(timer);
                    timer = setTimeout(function() {
                        fn.apply(context, args);
                    }, delay);
                };
            }

            // =============================================================
            // 4. LICENSE SYSTEM
            // =============================================================

            function checkLicense() {
                try {
                    var stored = localStorage.getItem('iptv_license');
                    var now = Date.now();
                    var deviceId = getDeviceId();

                    if (stored) {
                        var data = safeParseJSON(stored);
                        if (data && data.deviceId === deviceId) {
                            var expiry = data.expiry || 0;
                            if (expiry > now) {
                                STATE.licenseValid = true;
                                STATE.licenseExpiry = expiry;
                                if (dom.licenseStatus) {
                                    dom.licenseStatus.textContent = '🔓 Lisans: Geçerli (' + new Date(expiry)
                                        .toLocaleDateString() + ')';
                                }
                                return true;
                            }
                        }
                    }

                    var trialDays = 7;
                    var trialExpiry = now + (trialDays * 24 * 60 * 60 * 1000);
                    var licenseData = {
                        deviceId: deviceId,
                        expiry: trialExpiry,
                        trial: true
                    };
                    localStorage.setItem('iptv_license', JSON.stringify(licenseData));
                    STATE.licenseValid = true;
                    STATE.licenseExpiry = trialExpiry;
                    if (dom.licenseStatus) {
                        dom.licenseStatus.textContent = '🔓 Deneme süresi: ' + trialDays + ' gün (' + new Date(trialExpiry)
                            .toLocaleDateString() + ')';
                    }
                    return true;
                } catch (e) {
                    STATE.licenseValid = true;
                    if (dom.licenseStatus) {
                        dom.licenseStatus.textContent = '🔓 Deneme sürümü';
                    }
                    return true;
                }
            }

            // =============================================================
            // 5. ACCOUNT MANAGEMENT
            // =============================================================

            function loadAccounts() {
                try {
                    var data = localStorage.getItem('iptv_accounts');
                    STATE.accounts = data ? safeParseJSON(data) || [] : [];
                    renderAccountList();
                } catch (e) {
                    STATE.accounts = [];
                    renderAccountList();
                }
            }

            function saveAccounts() {
                try {
                    localStorage.setItem('iptv_accounts', JSON.stringify(STATE.accounts));
                    renderAccountList();
                } catch (e) {
                    showToast('Hesap kaydedilemedi: ' + e.message, 'error');
                }
            }

            function renderAccountList() {
                if (!dom.accountList) return;
                var list = dom.accountList;
                if (STATE.accounts.length === 0) {
                    list.innerHTML =
                        '<div style="text-align:center;opacity:0.5;padding:40px 0;">Henüz hesap eklenmemiş.</div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < STATE.accounts.length; i++) {
                    var acc = STATE.accounts[i];
                    var isActive = (acc.id === STATE.currentAccountId);
                    html += '<div class="account-item" data-id="' + acc.id + '" tabindex="0" style="' +
                        (isActive ? 'border-left-color:#4acf6a;' : '') + '">' +
                        '<div class="info">' +
                        '<div class="name">' + escapeHtml(acc.name || 'İsimsiz') +
                        (isActive ? ' ✅' : '') + '</div>' +
                        '<div class="url">' + escapeHtml(acc.serverUrl) + '</div>' +
                        '</div>' +
                        '<div class="actions">' +
                        '<button class="btn-primary" data-action="connect" data-id="' + acc.id +
                        '" style="padding:4px 12px;min-height:32px;min-width:32px;">▶️ Bağlan</button>' +
                        '<button data-action="edit" data-id="' + acc.id +
                        '" style="padding:4px 12px;min-height:32px;min-width:32px;">✏️</button>' +
                        '<button class="btn-danger" data-action="delete" data-id="' + acc.id +
                        '" style="padding:4px 12px;min-height:32px;min-width:32px;">🗑️</button>' +
                        '</div>' +
                        '</div>';
                }
                list.innerHTML = html;

                var items = list.querySelectorAll('[data-action]');
                for (var j = 0; j < items.length; j++) {
                    (function(el) {
                        el.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = this.getAttribute('data-action');
                            var id = this.getAttribute('data-id');
                            if (action === 'connect') {
                                connectAccount(id);
                            } else if (action === 'edit') {
                                editAccount(id);
                            } else if (action === 'delete') {
                                deleteAccount(id);
                            }
                        });
                    })(items[j]);
                }

                var accItems = list.querySelectorAll('.account-item');
                for (var k = 0; k < accItems.length; k++) {
                    (function(el) {
                        el.addEventListener('click', function() {
                            var id = this.getAttribute('data-id');
                            connectAccount(id);
                        });
                        el.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                var id = this.getAttribute('data-id');
                                connectAccount(id);
                            }
                        });
                    })(accItems[k]);
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getAccountFormData() {
                var url = dom.serverUrl.value.trim();
                var user = dom.username.value.trim();
                var pass = dom.password.value.trim();
                if (!url || !user || !pass) {
                    showToast('Lütfen tüm alanları doldurun.', 'error');
                    return null;
                }
                if (!url.match(/^https?:\/\//)) {
                    url = 'http://' + url;
                }
                return {
                    serverUrl: url,
                    username: user,
                    password: pass,
                    name: user + '@' + url.replace(/^https?:\/\//, '').split('/')[0]
                };
            }

            function saveAccount() {
                var data = getAccountFormData();
                if (!data) return;

                var existing = null;
                for (var i = 0; i < STATE.accounts.length; i++) {
                    if (STATE.accounts[i].serverUrl === data.serverUrl &&
                        STATE.accounts[i].username === data.username) {
                        existing = STATE.accounts[i];
                        break;
                    }
                }

                if (existing) {
                    existing.password = data.password;
                    existing.name = data.name;
                    showToast('Hesap güncellendi.', 'success');
                } else {
                    data.id = generateId();
                    STATE.accounts.push(data);
                    showToast('Hesap eklendi.', 'success');
                }

                saveAccounts();
                clearForm();
            }

            function clearForm() {
                dom.serverUrl.value = '';
                dom.username.value = '';
                dom.password.value = '';
                dom.serverUrl.focus();
            }

            function editAccount(id) {
                var acc = findAccount(id);
                if (!acc) return;
                dom.serverUrl.value = acc.serverUrl || '';
                dom.username.value = acc.username || '';
                dom.password.value = acc.password || '';
                dom.serverUrl.focus();
            }

            function deleteAccount(id) {
                if (!confirm('Bu hesabı silmek istediğinize emin misiniz?')) return;
                STATE.accounts = STATE.accounts.filter(function(a) { return a.id !== id; });
                if (STATE.currentAccountId === id) {
                    STATE.currentAccountId = null;
                    STATE.currentCategory = null;
                    STATE.currentItem = null;
                }
                saveAccounts();
                showToast('Hesap silindi.', 'info');
            }

            function findAccount(id) {
                for (var i = 0; i < STATE.accounts.length; i++) {
                    if (STATE.accounts[i].id === id) return STATE.accounts[i];
                }
                return null;
            }

            function getCurrentAccount() {
                if (!STATE.currentAccountId) return null;
                return findAccount(STATE.currentAccountId);
            }

            // =============================================================
            // 6. API CLIENT
            // =============================================================

            function apiRequest(url, callback) {
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', url, true);
                    xhr.timeout = 30000; // Increased timeout
                    xhr.onreadystatechange = function() {
                        if (xhr.readyState === 4) {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                var data = safeParseJSON(xhr.responseText);
                                if (data) {
                                    callback(null, data);
                                } else {
                                    callback('Geçersiz JSON yanıtı', null);
                                }
                            } else {
                                callback('HTTP ' + xhr.status + ': ' + xhr.statusText, null);
                            }
                        }
                    };
                    xhr.ontimeout = function() {
                        callback('Bağlantı zaman aşımına uğradı.', null);
                    };
                    xhr.onerror = function() {
                        callback('Ağ hatası oluştu.', null);
                    };
                    xhr.send();
                } catch (e) {
                    callback('İstek gönderilemedi: ' + e.message, null);
                }
            }

            function buildApiUrl(account, action, params) {
                var base = account.serverUrl;
                if (base.indexOf('/player_api.php') === -1) {
                    base = base.replace(/\/$/, '') + '/player_api.php';
                }
                var url = base + '?username=' + encodeURIComponent(account.username) +
                    '&password=' + encodeURIComponent(account.password) +
                    '&action=' + encodeURIComponent(action);
                if (params) {
                    for (var key in params) {
                        if (params.hasOwnProperty(key)) {
                            url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
                        }
                    }
                }
                return url;
            }

            function authenticateAccount(account, callback) {
                var url = buildApiUrl(account, 'get_live_streams');
                apiRequest(url, function(err, data) {
                    if (err) {
                        callback(err, null);
                        return;
                    }
                    if (data && data.user_info) {
                        callback(null, data);
                    } else {
                        callback('Geçersiz kimlik bilgileri veya sunucu yanıtı.', null);
                    }
                });
            }

            function fetchCategories(account, type, callback) {
                var actionMap = {
                    'live': 'get_live_categories',
                    'vod': 'get_vod_categories',
                    'series': 'get_series_categories'
                };
                var url = buildApiUrl(account, actionMap[type] || 'get_live_categories');
                apiRequest(url, function(err, data) {
                    if (err) {
                        callback(err, null);
                        return;
                    }
                    if (Array.isArray(data)) {
                        callback(null, data);
                    } else if (data && data.categories) {
                        callback(null, data.categories);
                    } else {
                        callback(null, []);
                    }
                });
            }

            function fetchItems(account, type, categoryId, callback) {
                var actionMap = {
                    'live': 'get_live_streams',
                    'vod': 'get_vod_streams',
                    'series': 'get_series'
                };
                var params = {};
                if (categoryId && categoryId !== '-1') {
                    params.category_id = categoryId;
                }
                var url = buildApiUrl(account, actionMap[type] || 'get_live_streams', params);
                apiRequest(url, function(err, data) {
                    if (err) {
                        callback(err, null);
                        return;
                    }
                    if (Array.isArray(data)) {
                        callback(null, data);
                    } else {
                        callback(null, []);
                    }
                });
            }

            function getStreamUrl(account, type, streamId, callback) {
                var action = '';
                var params = {};
                if (type === 'live') {
                    action = 'get_live_stream';
                    params.stream_id = streamId;
                } else if (type === 'vod') {
                    action = 'get_vod_stream';
                    params.vod_id = streamId;
                } else if (type === 'series') {
                    action = 'get_series_stream';
                    params.series_id = streamId;
                }
                var url = buildApiUrl(account, action, params);
                apiRequest(url, function(err, data) {
                    if (err) {
                        var base = account.serverUrl.replace(/\/player_api\.php.*$/, '');
                        var streamUrl = base + '/live/' + encodeURIComponent(account.username) + '/' +
                            encodeURIComponent(account.password) + '/' + streamId + '.m3u8';
                        callback(null, streamUrl);
                        return;
                    }
                    if (data && data.url) {
                        callback(null, data.url);
                    } else if (data && data.stream_url) {
                        callback(null, data.stream_url);
                    } else if (data && data.stream_info && data.stream_info.url) {
                        callback(null, data.stream_info.url);
                    } else {
                        var base2 = account.serverUrl.replace(/\/player_api\.php.*$/, '');
                        var streamUrl2 = base2 + '/live/' + encodeURIComponent(account.username) + '/' +
                            encodeURIComponent(account.password) + '/' + streamId + '.m3u8';
                        callback(null, streamUrl2);
                    }
                });
            }

            // =============================================================
            // 7. CONNECT & LOAD DATA (Optimized)
            // =============================================================

            function connectAccount(id) {
                var account = findAccount(id);
                if (!account) {
                    showToast('Hesap bulunamadı.', 'error');
                    return;
                }

                if (!STATE.licenseValid) {
                    showToast('Lisans geçersiz.', 'error');
                    return;
                }

                STATE.currentAccountId = id;
                STATE.currentCategory = null;
                STATE.currentItem = null;
                STATE.allItems = [];
                STATE.currentPage = 0;
                STATE.allItemsLoaded = false;

                showLoading('Bağlanıyor...');
                authenticateAccount(account, function(err, data) {
                    hideLoading();
                    if (err) {
                        showToast('Bağlantı hatası: ' + err, 'error');
                        return;
                    }
                    showToast('Bağlantı başarılı!', 'success');
                    STATE.userInfo = data.user_info || {};
                    showPlayerScreen();
                    loadCategories('live');
                    saveAccounts();
                    renderAccountList();
                });
            }

            function loadCategories(type) {
                var account = getCurrentAccount();
                if (!account) {
                    showToast('Lütfen önce bir hesaba bağlanın.', 'error');
                    return;
                }

                STATE.currentType = type;
                STATE.currentCategory = null;
                STATE.searchQuery = '';
                STATE.allItems = [];
                STATE.currentPage = 0;
                STATE.allItemsLoaded = false;

                showLoading('Kategoriler yükleniyor...');
                fetchCategories(account, type, function(err, categories) {
                    hideLoading();
                    if (err) {
                        showToast('Kategoriler yüklenirken hata: ' + err, 'error');
                        return;
                    }

                    STATE.apiCache[type + '_categories'] = categories;

                    var list = dom.categoryList;
                    var html = '<div class="category-item active" data-id="-1" tabindex="0">' +
                        '📁 Tümü <span class="count">-</span></div>';
                    for (var i = 0; i < categories.length; i++) {
                        var cat = categories[i];
                        var catId = cat.category_id || cat.id || i;
                        var catName = cat.category_name || cat.name || 'Kategori';
                        html += '<div class="category-item" data-id="' + catId + '" tabindex="0">' +
                            '📂 ' + escapeHtml(catName) +
                            ' <span class="count">-</span></div>';
                    }
                    list.innerHTML = html;

                    var items = list.querySelectorAll('.category-item');
                    for (var j = 0; j < items.length; j++) {
                        (function(el) {
                            el.addEventListener('click', function() {
                                var id = this.getAttribute('data-id');
                                selectCategory(id, type);
                            });
                            el.addEventListener('keydown', function(e) {
                                if (e.key === 'Enter' || e.key === ' ') {
                                    e.preventDefault();
                                    var id = this.getAttribute('data-id');
                                    selectCategory(id, type);
                                }
                            });
                        })(items[j]);
                    }

                    selectCategory('-1', type);
                });
            }

            function selectCategory(categoryId, type) {
                type = type || STATE.currentType;
                var account = getCurrentAccount();
                if (!account) return;

                STATE.currentCategory = categoryId;
                STATE.searchQuery = '';
                STATE.allItems = [];
                STATE.currentPage = 0;
                STATE.allItemsLoaded = false;

                var items = dom.categoryList.querySelectorAll('.category-item');
                for (var i = 0; i < items.length; i++) {
                    var el = items[i];
                    if (el.getAttribute('data-id') === categoryId) {
                        el.className = 'category-item active';
                    } else {
                        el.className = 'category-item';
                    }
                }

                showLoading('İçerik yükleniyor...');
                fetchItems(account, type, categoryId, function(err, data) {
                    hideLoading();
                    if (err) {
                        showToast('İçerik yüklenirken hata: ' + err, 'error');
                        return;
                    }

                    STATE.allItems = data || [];
                    STATE.currentPage = 0;
                    STATE.allItemsLoaded = false;

                    // Update category counts
                    var countMap = {};
                    for (var j = 0; j < data.length; j++) {
                        var catId = data[j].category_id || data[j].category_id || '0';
                        countMap[catId] = (countMap[catId] || 0) + 1;
                    }
                    var catItems = dom.categoryList.querySelectorAll('.category-item');
                    for (var k = 0; k < catItems.length; k++) {
                        var el2 = catItems[k];
                        var id2 = el2.getAttribute('data-id');
                        var count = countMap[id2] || countMap['0'] || 0;
                        if (id2 === '-1') {
                            count = data.length;
                        }
                        var span = el2.querySelector('.count');
                        if (span) span.textContent = count;
                    }

                    // Render first page
                    renderItemsPaginated();
                });
            }

            // =============================================================
            // 8. PAGINATED RENDER
            // =============================================================

            function renderItemsPaginated() {
                var items = STATE.allItems;
                if (!items || items.length === 0) {
                    dom.channelGrid.innerHTML =
                        '<div style="grid-column:1/-1;text-align:center;padding:60px 0;opacity:0.5;">İçerik bulunamadı.</div>';
                    return;
                }

                var start = STATE.currentPage * STATE.pageSize;
                var end = Math.min(start + STATE.pageSize, items.length);
                var pageItems = items.slice(start, end);

                if (pageItems.length === 0 && STATE.currentPage > 0) {
                    STATE.allItemsLoaded = true;
                    return;
                }

                var html = '';
                for (var i = 0; i < pageItems.length; i++) {
                    var item = pageItems[i];
                    var id = item.stream_id || item.id || item.series_id || '';
                    var name = item.name || item.title || item.stream_name || 'İsimsiz';
                    var icon = item.icon || item.stream_icon || item.cover || '';
                    var isFavorite = isItemFavorite(STATE.currentType, id);

                    html += '<div class="channel-card" data-id="' + id + '" data-type="' + STATE.currentType +
                        '" tabindex="0">';
                    if (icon) {
                        html += '<div class="icon"><img src="' + escapeHtml(icon) +
                            '" alt="" loading="lazy" /></div>';
                    } else {
                        html += '<div class="icon">📺</div>';
                    }
                    html += '<div class="name">' + escapeHtml(name) + '</div>';
                    html += '<div class="meta">' + (item.category_name || '') + '</div>';
                    html += '<button class="favorite-btn" data-action="favorite" data-id="' + id + '" data-type="' +
                        STATE.currentType + '">' + (isFavorite ? '⭐' : '☆') + '</button>';
                    html += '</div>';
                }

                // Append to grid
                if (STATE.currentPage === 0) {
                    dom.channelGrid.innerHTML = html;
                } else {
                    dom.channelGrid.innerHTML += html;
                }

                // Bind events for new cards
                var newCards = dom.channelGrid.querySelectorAll('.channel-card');
                var startIndex = start;
                for (var j = startIndex; j < newCards.length; j++) {
                    (function(el) {
                        el.addEventListener('click', function() {
                            var id = this.getAttribute('data-id');
                            var type = this.getAttribute('data-type') || STATE.currentType;
                            var nameEl = this.querySelector('.name');
                            var name = nameEl ? nameEl.textContent : 'İsimsiz';
                            playItem(id, type, name);
                        });
                        el.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                var id = this.getAttribute('data-id');
                                var type = this.getAttribute('data-type') || STATE.currentType;
                                var nameEl = this.querySelector('.name');
                                var name = nameEl ? nameEl.textContent : 'İsimsiz';
                                playItem(id, type, name);
                            }
                        });
                    })(newCards[j]);
                }

                // Favorite buttons
                var favBtns = dom.channelGrid.querySelectorAll('.favorite-btn');
                for (var k = 0; k < favBtns.length; k++) {
                    (function(el) {
                        el.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var id = this.getAttribute('data-id');
                            var type = this.getAttribute('data-type') || STATE.currentType;
                            toggleFavorite(type, id);
                        });
                    })(favBtns[k]);
                }

                STATE.currentPage++;

                // Check if all items loaded
                if (end >= items.length) {
                    STATE.allItemsLoaded = true;
                } else {
                    // Load more on scroll
                    setupInfiniteScroll();
                }

                // Apply search filter
                if (STATE.searchQuery) {
                    filterGrid(STATE.searchQuery);
                }
            }

            function setupInfiniteScroll() {
                var grid = dom.channelGrid;
                var scrollHandler = function() {
                    if (STATE.allItemsLoaded || STATE.isLoadingMore) return;

                    var scrollTop = grid.scrollTop;
                    var scrollHeight = grid.scrollHeight;
                    var clientHeight = grid.clientHeight;

                    if (scrollTop + clientHeight >= scrollHeight - 200) {
                        STATE.isLoadingMore = true;
                        showLoading('Daha fazla yükleniyor...');
                        setTimeout(function() {
                            renderItemsPaginated();
                            STATE.isLoadingMore = false;
                            hideLoading();
                        }, 100);
                    }
                };

                grid.addEventListener('scroll', scrollHandler);
                // Store handler reference for cleanup
                grid._scrollHandler = scrollHandler;
            }

            function filterGrid(query) {
                var cards = dom.channelGrid.querySelectorAll('.channel-card');
                var q = query.toLowerCase().trim();
                var visibleCount = 0;
                for (var i = 0; i < cards.length; i++) {
                    var card = cards[i];
                    var nameEl = card.querySelector('.name');
                    var metaEl = card.querySelector('.meta');
                    var name = nameEl ? nameEl.textContent : '';
                    var meta = metaEl ? metaEl.textContent : '';
                    var match = name.toLowerCase().indexOf(q) !== -1 || meta.toLowerCase().indexOf(q) !== -1;
                    card.style.display = match ? '' : 'none';
                    if (match) visibleCount++;
                }

                // If no visible items and we have more items to load, load more
                if (visibleCount === 0 && !STATE.allItemsLoaded && STATE.allItems.length > 0) {
                    // Load more to find matches
                    if (!STATE.isLoadingMore) {
                        STATE.isLoadingMore = true;
                        renderItemsPaginated();
                        STATE.isLoadingMore = false;
                    }
                }
            }

            // =============================================================
            // 9. PLAYER
            // =============================================================

            function playItem(itemId, type, title) {
                var account = getCurrentAccount();
                if (!account) {
                    showToast('Lütfen önce bir hesaba bağlanın.', 'error');
                    return;
                }

                STATE.currentItem = {
                    id: itemId,
                    type: type,
                    title: title
                };

                dom.currentTitle.textContent = title || 'Oynatılıyor...';

                showLoading('Akış hazırlanıyor...');

                getStreamUrl(account, type, itemId, function(err, url) {
                    if (err) {
                        hideLoading();
                        showToast('Stream URL alınamadı: ' + err, 'error');
                        return;
                    }

                    STATE.currentStreamUrl = url;
                    initPlayer(url);
                    hideLoading();
                    showToast('▶️ ' + (title || 'Oynatılıyor'), 'success');
                    updateFavoriteButton();
                    saveWatchHistory(type, itemId, title);
                });
            }

            function initPlayer(url) {
                var video = dom.videoPlayer;

                if (STATE.hlsInstance) {
                    STATE.hlsInstance.destroy();
                    STATE.hlsInstance = null;
                }

                if (!url || url.indexOf('file://') === 0) {
                    showToast('Geçersiz stream URL.', 'error');
                    return;
                }

                if (video.canPlayType('application/vnd.apple.mpegurl') ||
                    video.canPlayType('application/x-mpegURL')) {
                    video.src = url;
                    video.play();
                    STATE.isPlaying = true;
                    updatePlayPauseButton();
                    return;
                }

                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    try {
                        var hls = new Hls({
                            enableWorker: false, // Disable worker for LG TV
                            lowLatencyMode: true,
                            maxLoadingDelay: 4,
                            maxBufferLength: 30,
                            maxMaxBufferLength: 60,
                            startLevel: -1
                        });
                        STATE.hlsInstance = hls;
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            video.play();
                            STATE.isPlaying = true;
                            updatePlayPauseButton();
                        });
                        hls.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal) {
                                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                    showToast('Ağ hatası, yeniden bağlanılıyor...', 'error');
                                    hls.startLoad();
                                } else {
                                    showToast('Video hatası: ' + (data.details || ''), 'error');
                                }
                            }
                        });
                    } catch (e) {
                        showToast('HLS başlatılamadı: ' + e.message, 'error');
                    }
                } else {
                    showToast('HLS desteği bulunamadı.', 'error');
                }
            }

            function togglePlayPause() {
                var video = dom.videoPlayer;
                if (video.paused) {
                    video.play();
                    STATE.isPlaying = true;
                } else {
                    video.pause();
                    STATE.isPlaying = false;
                }
                updatePlayPauseButton();
            }

            function updatePlayPauseButton() {
                dom.playPauseBtn.textContent = STATE.isPlaying ? '⏸️' : '▶️';
            }

            function updateFavoriteButton() {
                var item = STATE.currentItem;
                if (!item) return;
                var isFav = isItemFavorite(item.type, item.id);
                dom.favoriteBtn.textContent = isFav ? '⭐' : '☆';
            }

            function toggleFavorite(type, id) {
                var favs = STATE.favorites;
                var key = type + ':' + id;
                var idx = favs.indexOf(key);
                if (idx === -1) {
                    favs.push(key);
                    showToast('⭐ Favorilere eklendi.', 'success');
                } else {
                    favs.splice(idx, 1);
                    showToast('☆ Favorilerden çıkarıldı.', 'info');
                }
                try {
                    localStorage.setItem('iptv_favorites', JSON.stringify(favs));
                } catch (e) {}
                updateFavoriteButton();

                // Update grid
                var cards = dom.channelGrid.querySelectorAll('.channel-card');
                for (var i = 0; i < cards.length; i++) {
                    var card = cards[i];
                    var fid = card.getAttribute('data-id');
                    var ftype = card.getAttribute('data-type') || STATE.currentType;
                    if (fid === id && ftype === type) {
                        var btn = card.querySelector('.favorite-btn');
                        if (btn) {
                            var isFav = isItemFavorite(type, id);
                            btn.textContent = isFav ? '⭐' : '☆';
                        }
                    }
                }
            }

            function isItemFavorite(type, id) {
                var key = type + ':' + id;
                return STATE.favorites.indexOf(key) !== -1;
            }

            function saveWatchHistory(type, id, title) {
                try {
                    var history = STATE.watchHistory;
                    var key = type + ':' + id;
                    history[key] = {
                        title: title,
                        type: type,
                        id: id,
                        timestamp: Date.now(),
                        position: 0
                    };
                    localStorage.setItem('iptv_watch_history', JSON.stringify(history));
                } catch (e) {}
            }

            function loadWatchHistory() {
                try {
                    var data = localStorage.getItem('iptv_watch_history');
                    STATE.watchHistory = data ? safeParseJSON(data) || {} : {};
                } catch (e) {
                    STATE.watchHistory = {};
                }
            }

            function loadFavorites() {
                try {
                    var data = localStorage.getItem('iptv_favorites');
                    STATE.favorites = data ? safeParseJSON(data) || [] : [];
                } catch (e) {
                    STATE.favorites = [];
                }
            }

            // =============================================================
            // 10. NAVIGATION & UI
            // =============================================================

            function showPlayerScreen() {
                dom.panelScreen.style.display = 'none';
                dom.playerScreen.className = 'active';
                dom.videoWrapper.focus();
                dom.playerControls.className = 'player-controls active';
                setTimeout(function() {
                    dom.playerControls.className = 'player-controls';
                }, 3000);
            }

            function showPanelScreen() {
                dom.panelScreen.style.display = 'flex';
                dom.playerScreen.className = '';
                stopVideo();
                closeSidebar();
            }

            function stopVideo() {
                var video = dom.videoPlayer;
                video.pause();
                video.removeAttribute('src');
                video.load();
                if (STATE.hlsInstance) {
                    STATE.hlsInstance.destroy();
                    STATE.hlsInstance = null;
                }
                STATE.isPlaying = false;
                STATE.currentStreamUrl = null;
                STATE.currentItem = null;
                updatePlayPauseButton();
            }

            function toggleSidebar() {
                if (dom.sidebar.className === 'sidebar open') {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            }

            function openSidebar() {
                dom.sidebar.className = 'sidebar open';
                STATE.sidebarOpen = true;
                dom.sidebarToggleBtn.textContent = '✕';
            }

            function closeSidebar() {
                dom.sidebar.className = 'sidebar';
                STATE.sidebarOpen = false;
                dom.sidebarToggleBtn.textContent = '📂';
            }

            function toggleFullscreen() {
                var wrapper = dom.videoWrapper;
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                } else if (wrapper.mozRequestFullScreen) {
                    wrapper.mozRequestFullScreen();
                }
            }

            // =============================================================
            // 11. THEME
            // =============================================================

            function toggleTheme() {
                STATE.isLightTheme = !STATE.isLightTheme;
                document.body.className = STATE.isLightTheme ? 'light-theme' : '';
                dom.themeToggle.textContent = STATE.isLightTheme ? '🌙' : '☀️';
                try {
                    localStorage.setItem('iptv_theme', STATE.isLightTheme ? 'light' : 'dark');
                } catch (e) {}
            }

            function loadTheme() {
                try {
                    var theme = localStorage.getItem('iptv_theme');
                    if (theme === 'light') {
                        STATE.isLightTheme = true;
                        document.body.className = 'light-theme';
                        dom.themeToggle.textContent = '🌙';
                    } else {
                        STATE.isLightTheme = false;
                        document.body.className = '';
                        dom.themeToggle.textContent = '☀️';
                    }
                } catch (e) {
                    STATE.isLightTheme = false;
                    document.body.className = '';
                    dom.themeToggle.textContent = '☀️';
                }
            }

            // =============================================================
            // 12. EVENT BINDING
            // =============================================================

            function bindEvents() {
                dom.saveAccountBtn.addEventListener('click', saveAccount);
                dom.clearFormBtn.addEventListener('click', clearForm);
                dom.themeToggle.addEventListener('click', toggleTheme);

                dom.playPauseBtn.addEventListener('click', togglePlayPause);
                dom.favoriteBtn.addEventListener('click', function() {
                    var item = STATE.currentItem;
                    if (item) {
                        toggleFavorite(item.type, item.id);
                    }
                });
                dom.sidebarToggleBtn.addEventListener('click', toggleSidebar);
                dom.closeSidebarBtn.addEventListener('click', toggleSidebar);
                dom.backToPanelBtn.addEventListener('click', function() {
                    if (confirm('Panele dönmek istediğinize emin misiniz?')) {
                        showPanelScreen();
                    }
                });
                dom.fullscreenBtn.addEventListener('click', toggleFullscreen);

                dom.volumeSlider.addEventListener('input', function() {
                    dom.videoPlayer.volume = parseFloat(this.value);
                    dom.muteBtn.textContent = dom.videoPlayer.volume > 0 ? '🔊' : '🔇';
                });
                dom.muteBtn.addEventListener('click', function() {
                    var video = dom.videoPlayer;
                    video.muted = !video.muted;
                    this.textContent = video.muted ? '🔇' : '🔊';
                });

                dom.progressBar.addEventListener('click', function(e) {
                    var rect = this.getBoundingClientRect();
                    var x = (e.clientX - rect.left) / rect.width;
                    var duration = dom.videoPlayer.duration;
                    if (duration && isFinite(duration)) {
                        dom.videoPlayer.currentTime = x * duration;
                    }
                });

                var video = dom.videoPlayer;
                video.addEventListener('timeupdate', updateProgress);
                video.addEventListener('loadedmetadata', function() {
                    dom.durationTime.textContent = formatTime(this.duration);
                });
                video.addEventListener('play', function() {
                    STATE.isPlaying = true;
                    updatePlayPauseButton();
                });
                video.addEventListener('pause', function() {
                    STATE.isPlaying = false;
                    updatePlayPauseButton();
                });
                video.addEventListener('ended', function() {
                    STATE.isPlaying = false;
                    updatePlayPauseButton();
                });
                video.addEventListener('error', function(e) {
                    showToast('Video hatası: ' + (this.error ? this.error.message : ''), 'error');
                });

                var searchDebounced = debounce(function() {
                    var query = dom.searchInput.value;
                    STATE.searchQuery = query;
                    // Reset grid and show filtered results
                    if (query.length > 2) {
                        // Search across all items
                        filterGrid(query);
                    } else if (query.length === 0) {
                        // Show all
                        var cards = dom.channelGrid.querySelectorAll('.channel-card');
                        for (var i = 0; i < cards.length; i++) {
                            cards[i].style.display = '';
                        }
                    }
                }, 300);
                dom.searchInput.addEventListener('input', searchDebounced);

                document.addEventListener('keydown', function(e) {
                    if (e.key === ' ' && dom.playerScreen.className === 'active') {
                        e.preventDefault();
                        togglePlayPause();
                    }
                    if (e.key === 'f' && dom.playerScreen.className === 'active') {
                        e.preventDefault();
                        toggleFullscreen();
                    }
                    if (e.key === 'Escape') {
                        if (STATE.sidebarOpen) closeSidebar();
                    }
                });

                document.addEventListener('fullscreenchange', function() {
                    dom.fullscreenBtn.textContent = document.fullscreenElement ? '⛶' : '⛶';
                });

                var controlsTimer = null;
                dom.videoWrapper.addEventListener('mousemove', function() {
                    dom.playerControls.className = 'player-controls active';
                    clearTimeout(controlsTimer);
                    controlsTimer = setTimeout(function() {
                        if (!STATE.sidebarOpen) {
                            dom.playerControls.className = 'player-controls';
                        }
                    }, 3000);
                });
                dom.videoWrapper.addEventListener('touchstart', function() {
                    var isActive = dom.playerControls.className.indexOf('active') !== -1;
                    if (isActive) {
                        dom.playerControls.className = 'player-controls';
                    } else {
                        dom.playerControls.className = 'player-controls active';
                        clearTimeout(controlsTimer);
                        controlsTimer = setTimeout(function() {
                            dom.playerControls.className = 'player-controls';
                        }, 3000);
                    }
                });
            }

            function updateProgress() {
                var video = dom.videoPlayer;
                if (!video || !video.duration || !isFinite(video.duration)) return;
                var percent = (video.currentTime / video.duration) * 100;
                dom.progressFill.style.width = percent + '%';
                dom.progressHandle.style.left = percent + '%';
                dom.currentTime.textContent = formatTime(video.currentTime);
                dom.durationTime.textContent = formatTime(video.duration);
            }

            // =============================================================
            // 13. INIT
            // =============================================================

            function init() {
                try {
                    STATE.deviceId = getDeviceId();
                    checkLicense();
                    loadTheme();
                    loadAccounts();
                    loadFavorites();
                    loadWatchHistory();
                    bindEvents();

                    STATE.isInitialized = true;

                    console.log('📺 LG Smart IPTV initialized');
                    console.log('📱 Device ID:', STATE.deviceId);
                    console.log('🔒 License:', STATE.licenseValid ? 'Valid' : 'Invalid');
                    console.log('📋 Accounts:', STATE.accounts.length);

                    if (STATE.accounts.length === 0) {
                        dom.serverUrl.focus();
                    }
                } catch (e) {
                    console.error('Init error:', e);
                    showToast('Başlangıç hatası: ' + e.message, 'error');
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
