<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LG Smart TV IPTV Player</title>
  <!-- HLS.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --panel-bg: #1e1e1e;
      --active-bg: #e50914;
      --focus-border: 3px solid #f5c518;
    }

    body.light-theme {
      --bg-color: #f4f4f9;
      --text-color: #121212;
      --panel-bg: #ffffff;
      --active-bg: #007bff;
      --focus-border: 3px solid #0056b3;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Kumanda Focus Stili */
    :focus {
      outline: var(--focus-border) !important;
      background-color: var(--active-bg) !important;
      color: #fff !important;
    }

    .screen { display: none; width: 100%; height: 100%; }
    .screen.active { display: flex; }

    /* PANEL EKRANI */
    #panel-screen {
      flex-direction: column;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
    }

    .form-section, .list-section {
      flex: 1;
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 8px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
    }

    .account-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #2a2a2a;
      border-radius: 4px;
      cursor: pointer;
    }

    /* PLAYER EKRANI */
    #player-screen {
      display: none;
      flex-direction: row;
      position: relative;
    }

    .sidebar {
      width: 300px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
    }

    .item-btn {
      width: 100%;
      text-align: left;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-color);
      border-bottom: 1px solid #333;
    }

    .video-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
    }

    .player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .player-controls button {
      width: auto;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- 1. PANEL EKRANI -->
  <div id="panel-screen" class="screen active">
    <div class="header">
      <h2>LG Smart TV IPTV Player</h2>
      <button id="theme-toggle" tabindex="1">Tema Değiştir (☀️/🌙)</button>
    </div>
    <div class="main-content">
      <div class="form-section">
        <h3>Hesap Ekle</h3>
        <input type="text" id="iptv-url" placeholder="Sunucu URL (http://domain.com:8080)" tabindex="2">
        <input type="text" id="iptv-user" placeholder="Kullanıcı Adı" tabindex="3">
        <input type="password" id="iptv-pass" placeholder="Şifre" tabindex="4">
        <button id="save-btn" tabindex="5">Kaydet ve Bağlan</button>
      </div>
      <div class="list-section">
        <h3>Kayıtlı Hesaplar</h3>
        <div id="accounts-list"></div>
      </div>
    </div>
  </div>

  <!-- 2. VIDEO PLAYER EKRANI -->
  <div id="player-screen" class="screen">
    <div class="sidebar">
      <button id="back-btn" tabindex="6">← Panele Dön</button>
      <h3>Kategoriler</h3>
      <div id="category-list" class="list-container"></div>
    </div>
    <div class="sidebar">
      <h3>Kanallar</h3>
      <div id="channel-list" class="list-container"></div>
    </div>
    <div class="video-container">
      <video id="video-player" controls></video>
      <div class="player-controls">
        <button id="btn-play" tabindex="7">Oynat / Durdur</button>
        <button id="btn-vol-down" tabindex="8">Ses -</button>
        <button id="btn-vol-up" tabindex="9">Ses +</button>
      </div>
    </div>
  </div>

  <script>
    // ES5 UYUMLU JAVASCRIPT

    // Değişken Tanımlamaları (var kullanımı)
    var currentAccount = null;
    var hlsPlayer = null;
    var videoEl = document.getElementById('video-player');

    // DOM Elemanları
    var panelScreen = document.getElementById('panel-screen');
    var playerScreen = document.getElementById('player-screen');
    var accountsListEl = document.getElementById('accounts-list');
    var categoryListEl = document.getElementById('category-list');
    var channelListEl = document.getElementById('channel-list');

    // 1. TEMA DEĞİŞTİRME (Dark/Light)
    document.getElementById('theme-toggle').addEventListener('click', function() {
      document.body.classList.toggle('light-theme');
    });

    // 2. XMLHttpRequest WRAPPER (ES5)
    function makeRequest(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              callback(null, data);
            } catch(e) {
              callback('JSON ayrıştırma hatası', null);
            }
          } else {
            callback('Bağlantı hatası: ' + xhr.status, null);
          }
        }
      };
      xhr.send();
    }

    // 3. HESAP YÖNETİMİ (localStorage)
    function loadAccounts() {
      accountsListEl.innerHTML = '';
      var accounts = JSON.parse(localStorage.getItem('iptv_accounts') || '[]');
      
      for (var i = 0; i < accounts.length; i++) {
        var acc = accounts[i];
        var btn = document.createElement('button');
        btn.className = 'account-item item-btn';
        btn.setAttribute('tabindex', (10 + i).toString());
        btn.innerHTML = acc.user + ' (' + acc.url + ')';
        
        // ES5 Kapanış (Closure) Mantığı
        (function(accountData) {
          btn.addEventListener('click', function() {
            connectAccount(accountData);
          });
        })(acc);

        accountsListEl.appendChild(btn);
      }
    }

    document.getElementById('save-btn').addEventListener('click', function() {
      var url = document.getElementById('iptv-url').value.trim();
      var user = document.getElementById('iptv-user').value.trim();
      var pass = document.getElementById('iptv-pass').value.trim();

      if (!url || !user || !pass) {
        alert('Lütfen tüm alanları doldurun!');
        return;
      }

      var accounts = JSON.parse(localStorage.getItem('iptv_accounts') || '[]');
      var newAccount = { url: url, user: user, pass: pass };
      accounts.push(newAccount);
      localStorage.setItem('iptv_accounts', JSON.stringify(accounts));

      // Formu Temizle
      document.getElementById('iptv-url').value = '';
      document.getElementById('iptv-user').value = '';
      document.getElementById('iptv-pass').value = '';

      loadAccounts();
      connectAccount(newAccount);
    });

    // 4. XTREAM CODES API BAĞLANTISI
    function connectAccount(acc) {
      currentAccount = acc;
      var authUrl = acc.url + '/player_api.php?username=' + acc.user + '&password=' + acc.pass;

      makeRequest(authUrl, function(err, response) {
        if (err || (response && response.user_info && response.user_info.auth === 0)) {
          alert('Giriş başarısız! Bilgileri kontrol edin.');
          return;
        }

        // Ekran Değiştir
        panelScreen.classList.remove('active');
        playerScreen.classList.add('active');

        loadCategories();
      });
    }

    // 5. KATEGORİ VE KANALLARI YÜKLE
    function loadCategories() {
      var catUrl = currentAccount.url + '/player_api.php?username=' + currentAccount.user + 
                     '&password=' + currentAccount.pass + '&action=get_live_categories';
      
      makeRequest(catUrl, function(err, categories) {
        if (err) return;
        categoryListEl.innerHTML = '';
        
        for (var i = 0; i < categories.length; i++) {
          var cat = categories[i];
          var btn = document.createElement('button');
          btn.className = 'item-btn';
          btn.setAttribute('tabindex', (100 + i).toString());
          btn.innerText = cat.category_name;

          (function(catId) {
            btn.addEventListener('click', function() {
              loadChannels(catId);
            });
          })(cat.category_id);

          categoryListEl.appendChild(btn);
        }
      });
    }

    function loadChannels(categoryId) {
      var chanUrl = currentAccount.url + '/player_api.php?username=' + currentAccount.user + 
                      '&password=' + currentAccount.pass + '&action=get_live_streams&category_id=' + categoryId;

      makeRequest(chanUrl, function(err, channels) {
        if (err) return;
        channelListEl.innerHTML = '';

        for (var i = 0; i < channels.length; i++) {
          var chan = channels[i];
          var btn = document.createElement('button');
          btn.className = 'item-btn';
          btn.setAttribute('tabindex', (1000 + i).toString());
          btn.innerText = chan.name;

          (function(streamId) {
            btn.addEventListener('click', function() {
              playStream(streamId);
            });
          })(chan.stream_id);

          channelListEl.appendChild(btn);
        }
      });
    }

    // 6. HLS VIDEO OYNATICI (HLS.js)
    function playStream(streamId) {
      // Stream URL Yapısı (Live için .m3u8)
      var streamUrl = currentAccount.url + '/live/' + currentAccount.user + '/' + currentAccount.pass + '/' + streamId + '.m3u8';

      if (hlsPlayer) {
        hlsPlayer.destroy();
      }

      if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(streamUrl);
        hlsPlayer.attachMedia(videoEl);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
          videoEl.play();
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / Bazı TV Dahili Oynatıcıları
        videoEl.src = streamUrl;
        videoEl.play();
      }
    }

    function stopVideo() {
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
    }

    // 7. KONTROLLER VE PANEL DÖNÜŞÜ
    document.getElementById('back-btn').addEventListener('click', function() {
      stopVideo(); // Panel ekranına dönülünce videoyu durdur
      playerScreen.classList.remove('active');
      panelScreen.classList.add('active');
    });

    document.getElementById('btn-play').addEventListener('click', function() {
      if (videoEl.paused) {
        videoEl.play();
      } else {
        videoEl.pause();
      }
    });

    document.getElementById('btn-vol-up').addEventListener('click', function() {
      if (videoEl.volume < 1) videoEl.volume = Math.min(1, videoEl.volume + 0.1);
    });

    document.getElementById('btn-vol-down').addEventListener('click', function() {
      if (videoEl.volume > 0) videoEl.volume = Math.max(0, videoEl.volume - 0.1);
    });

    // 8. TV KUMANDASI YÖN TUŞLARI İLE OYNAŞMA (Focus Navigasyonu)
    window.addEventListener('keydown', function(e) {
      var focusable = Array.prototype.slice.call(
        document.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')
      ).filter(function(el) {
        return el.offsetParent !== null; // Sadece görünür elemanlar
      });

      var index = focusable.indexOf(document.activeElement);

      switch(e.keyCode) {
        case 37: // Sol Ok
        case 38: // Yukarı Ok
          if (index > 0) focusable[index - 1].focus();
          break;
        case 39: // Sağ Ok
        case 40: // Aşağı Ok
          if (index < focusable.length - 1) focusable[index + 1].focus();
          break;
        case 461: // LG webOS Geri Tuşu (Back Key)
          if (playerScreen.classList.contains('active')) {
            document.getElementById('back-btn').click();
          }
          break;
      }
    });

    // Uygulama Başlangıcı
    loadAccounts();
  </script>
</body>
</html>
